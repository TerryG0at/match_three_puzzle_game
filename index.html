<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>မုန့်ပွဲတော် - Mont Pwel Taw</title>
    <meta name="theme-color" content="#ffe58a" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="Mont Pwel Taw match-three game">
      <header class="top-bar">
        <div class="title-block">
          <p class="eyebrow">Mont Pwel Taw</p>
          <h1><span lang="my">မုန့်ပွဲတော်</span></h1>
        </div>
        <section class="score-panel" aria-live="polite">
          <span class="score-label" lang="my">အမှတ်</span>
          <strong id="scoreValue">0</strong>
        </section>
      </header>

      <section class="status-strip" aria-live="polite">
        <span id="moveStatus" lang="my">မုန့်ကို ဆွဲပြီး လဲပါ။</span>
        <span id="specialDishStatus" lang="my">အထူးမုန့်: 0</span>
      </section>

      <section class="board-wrap">
        <div id="gameBoard" class="game-board" aria-label="8 by 8 food puzzle board"></div>
      </section>

      <footer class="legend" id="foodLegend" aria-label="Food legend"></footer>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
