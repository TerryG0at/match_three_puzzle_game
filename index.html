<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Myanmar Food Match Three</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="Myanmar food match-three game">
      <header class="top-bar">
        <div>
          <p class="eyebrow">Match Three</p>
          <h1>Food Puzzle</h1>
        </div>
        <section class="score-panel" aria-live="polite">
          <span class="score-label">Score</span>
          <strong id="scoreValue">0</strong>
        </section>
      </header>

      <section class="status-strip" aria-live="polite">
        <span id="moveStatus">Swipe a dish to swap.</span>
        <span id="specialDishStatus">Special Dishes: 0</span>
      </section>

      <section class="board-wrap">
        <div id="gameBoard" class="game-board" aria-label="8 by 8 food puzzle board"></div>
      </section>

      <footer class="legend" id="foodLegend" aria-label="Food legend"></footer>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
